<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Mentors | Connect</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Connect</a>
    <div class="nav-links">
      <a href="dashboard-student.html">My Dashboard</a>
      <a href="index.html" class="btn btn-outline">Log Out</a>
    </div>
  </nav>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <h2>Find a Mentor</h2>
      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by role or industry..." style="width: 250px;">
        <button class="btn btn-primary" onclick="filterMentors()">Search</button>
      </div>
    </div>

    <!-- Mentor Grid -->
    <div class="grid-3" id="mentorGrid">
      <!-- Cards will be generated by browse.js -->
    </div>
  </main>

  <script src="assets/js/browse.js"></script>
</body>
</html>
